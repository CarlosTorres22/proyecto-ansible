[defaults]
inventory = inventario/hosts.yml
host_key_checking = False
gathering = explicit
forks = 10
timeout = 30
interpreter_python = auto_silent
callback_result_format = yaml
deprecation_warnings = False

[persistent_connection]
connect_timeout = 60
command_timeout = 90
ssh_type = paramiko

[paramiko_connection]
look_for_keys = False
host_key_auto_add = True
