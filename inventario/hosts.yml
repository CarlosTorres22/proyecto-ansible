---
# Inventario de la Compania XYZ
all:
  children:

    # Servidor de automatizacion (Ubuntu 24.04): Ansible + Zabbix
    servidor:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

    # El mismo servidor, visto a traves de la API web de Zabbix
    zabbix:
      hosts:
        zabbix_api:

    # Todos los equipos de red (routers, switches y PCs-router)
    red:
      children:
        isp:
          hosts:
            R2:
        guatemala:
          hosts:
            R1:
            SW5:
            PC8:
        salvador:
          hosts:
            R3:
            SW6:
            PC9:
        honduras:
          hosts:
            R4:
            SW7:
            PC10:

    # Agrupaciones por funcion
    bordes:
      hosts:
        R1:
        R3:
        R4:
    switches:
      hosts:
        SW5:
        SW6:
        SW7:
    pcs:
      hosts:
        PC8:
        PC9:
        PC10:

    # Agrupaciones por forma de gestion
    gestion_oob:        # conectados a la nube Net (alcanzables desde el inicio)
      hosts:
        R1:
        R2:
        R3:
        R4:
        SW5:
        SW6:
        SW7:
    gestion_inband:     # sin enlace a Net: se alcanzan a traves de la red
      hosts:
        PC8:
        PC9:
        PC10:
